<style>
:root{--ink:#23352f;--muted:#68766f;--line:#dfe5df;--green:#24664f;--pale:#edf4ed;--paper:#fafbf8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Pretendard","Malgun Gothic",sans-serif;font-size:15px;line-height:1.65}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;background:white;border:1px solid var(--line);border-radius:10px;padding:10px 16px}button:hover{background:var(--pale)}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #79b79c;outline-offset:3px}header{height:82px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 36px;gap:20px}.brand{display:flex;gap:12px;align-items:center}.mark{background:var(--green);color:white;border-radius:13px;width:40px;height:40px;display:grid;place-items:center;font-size:25px}.brand strong{font-size:20px;letter-spacing:-1px}.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted)}.headright{display:flex;align-items:center;gap:24px}.small{font-size:12px;color:var(--muted)}.progress{width:116px;height:4px;background:#e8ede8;border-radius:5px;margin-top:6px}.progress i{display:block;height:100%;background:var(--green);border-radius:5px}.top{max-width:1440px;margin:auto;padding:22px 36px;display:flex;justify-content:space-between;align-items:center;gap:20px}.levels{display:flex;align-items:center;gap:16px}.level{border:0;background:transparent;color:var(--muted);display:flex;align-items:center;gap:9px;padding:6px}.level span{border:1px solid #d3ddd5;border-radius:50%;width:29px;height:29px;display:grid;place-items:center;font-size:12px}.level.active{color:var(--green);font-weight:700}.level.active span{background:var(--green);color:white;border-color:var(--green)}.connector{width:48px;height:1px;background:var(--line)}.layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:380px minmax(0,1fr);gap:40px;padding:0 36px 25px}.lesson{padding:14px 0}.eyebrow{font-size:12px;color:var(--green);font-weight:700;letter-spacing:.5px}h1{font-size:30px;line-height:1.35;letter-spacing:-1.5px;margin:13px 0 15px;word-break:keep-all}p{margin:0 0 18px}.intro{color:var(--muted);font-size:14px}.tags{display:flex;gap:7px;margin-bottom:23px}.tag{font-size:11px;background:#eaf0e8;color:#52634f;padding:4px 9px;border-radius:6px}.sectionlabel{font-size:11px;letter-spacing:1.4px;color:var(--muted);margin-bottom:8px}.mission{border:1px solid var(--line);border-radius:14px;background:white;overflow:hidden}.missionhead{padding:15px 18px;display:flex;justify-content:space-between;border-bottom:1px solid #eef1ec;font-weight:700;font-size:14px}.checkrow{padding:12px 18px;display:flex;gap:12px;align-items:flex-start;font-size:13px;cursor:pointer}.checkrow input{accent-color:var(--green);width:17px;height:17px;flex-shrink:0;margin-top:3px}.checkrow:has(input:checked){color:var(--muted)}.example{margin-top:20px;background:#edf3eb;border-radius:13px;padding:18px}.example p{font-size:13px;line-height:1.85;margin:10px 0 15px;white-space:pre-line}.example button{width:100%;background:white;color:var(--green);font-weight:700;font-size:13px;border-color:#d1dfce}.hint{margin-top:16px;font-size:12px;color:var(--muted)}.hint summary{cursor:pointer;padding:8px 0}.hint p{padding:8px 0}.practice{min-width:0;min-height:690px;height:calc(100vh - 191px);max-height:950px;border:1px solid var(--line);background:white;border-radius:19px;box-shadow:0 10px 35px #243e2e07;display:flex;flex-direction:column;overflow:hidden}.practicebar{display:flex;justify-content:space-between;align-items:center;padding:17px 23px;border-bottom:1px solid var(--line);background:#f5f7f2;gap:12px}.practicebar strong{font-size:14px}.practicebar button{font-size:12px;padding:6px 10px;background:transparent}.dot{display:inline-block;width:7px;height:7px;background:#73977c;border-radius:50%;margin-right:7px}.chat{flex:1;overflow:auto;padding:28px 30px;scroll-behavior:smooth}.welcome{height:100%;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px 0 30px}.art{width:134px;height:114px;margin-bottom:22px}.welcome h2{font-size:25px;letter-spacing:-1px;font-weight:600;margin:0 0 10px}.welcome>p{font-size:14px;color:var(--muted);max-width:380px}.suggestion{max-width:430px;border:1px solid var(--line);padding:15px 19px;border-radius:12px;text-align:left;width:100%;background:white;margin-top:12px;font-size:13px;display:flex;gap:15px;align-items:center}.suggestion span{font-size:22px;color:var(--green)}.suggestion small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.compose{margin:0 24px 18px;border:1px solid #d5ded3;border-radius:15px;padding:15px;background:#fdfefb;box-shadow:0 3px 9px #183d2810}.compose textarea{resize:vertical;min-height:66px;max-height:180px;width:100%;border:0;background:transparent;outline:none;font-size:14px;color:var(--ink)}.composefoot{display:flex;align-items:center;justify-content:space-between;gap:10px}.send{background:var(--green);color:white;border:0;padding:9px 17px}.send:hover{background:#174e3b}.disclaimer{text-align:center;font-size:11px;color:var(--muted);padding:0 15px 15px}.message{max-width:90%;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:22px;line-height:1.9}.message.user{margin-left:auto;background:var(--pale);padding:14px 18px;border-radius:14px 14px 2px 14px}.message.assistant{padding:14px 0}.message b{display:block;font-size:11px;letter-spacing:.5px;color:var(--green);margin-bottom:8px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:22px}.bottom button{font-size:12px}.bottom .primary{color:white;background:var(--green);border-color:var(--green)}dialog{border:1px solid var(--line);border-radius:20px;width:640px;max-width:calc(100% - 28px);max-height:85vh;padding:25px;color:var(--ink);box-shadow:0 20px 90px #12332430}dialog::backdrop{background:#152d264d;backdrop-filter:blur(4px)}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.dialoghead h2{margin:0;font-size:22px}#search{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}.coursegroup h3{font-size:14px;margin:22px 0 7px;color:var(--green)}.courseitem{display:block;width:100%;text-align:left;border:0;border-radius:7px;font-size:13px;padding:10px 12px}.courseitem[aria-current=true]{background:var(--pale);font-weight:700}.courseitem em{font-style:normal;color:var(--muted);margin-right:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 22px;border-radius:12px;z-index:5;max-width:90%;font-size:13px}.toast:empty{display:none}@media(min-width:1500px){.layout{gap:55px;grid-template-columns:400px minmax(0,1fr)}}@media(max-width:1000px){.layout{grid-template-columns:320px minmax(0,1fr);gap:22px;padding:0 22px 25px}.top{padding:20px 22px}.levels{gap:8px}.connector{width:20px}.practicebar{padding:15px}.chat{padding:20px}.welcome h2{font-size:22px}.headright{gap:14px}}@media(max-width:740px){header{height:70px;padding:0 18px}.brand strong{font-size:17px}.headright .small{display:none}.headright button{padding:8px 12px;font-size:12px}.top{padding:17px 18px}.top>.small{display:none}.levels{width:100%;justify-content:space-between;gap:3px}.level{font-size:12px;gap:6px}.connector{width:15px}.layout{display:flex;flex-direction:column;padding:0 18px 24px;gap:22px}.lesson{padding-top:5px}h1{font-size:27px}.practice{height:650px;min-height:600px}.chat{padding:20px}.compose{margin:0 15px 13px}.practicebar .small{font-size:10px}.bottom{padding-top:17px}.welcome h2{font-size:22px}.welcome>p{font-size:13px}.art{height:90px}.message{max-width:95%}}
</style></head><body>
<header><div class="brand"><span class="mark" aria-hidden="true">✳</span><div><strong>마이 AI 랩</strong><small>GANGNEUNG · LEARNING LAB</small></div></div><div class="headright"><div class="small"><span id="progressText">나의 배움 0 / 22</span><div class="progress"><i id="progressFill"></i></div></div><button id="openCourses">☰ &nbsp; 전체 수업</button></div></header>
<nav class="top" aria-label="학습 단계"><div class="levels"><button class="level" data-level="0"><span>1</span>기초 · 콘텐츠</button><i class="connector"></i><button class="level" data-level="1"><span>2</span>중급 · 활용</button><i class="connector"></i><button class="level" data-level="2"><span>3</span>고급 · 제작</button></div><div class="small">조금씩 배우고, 직접 만들어 보세요.</div></nav>
<main class="layout"><article class="lesson"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="intro" id="intro"></p><div class="tags"><span class="tag" id="output"></span><span class="tag">따라 하는 실습</span></div><div class="sectionlabel">TODAY’S MISSION</div><section class="mission"><div class="missionhead">이렇게 해보세요 <span class="small" id="stepCount"></span></div><div id="steps"></div></section><section class="example"><strong style="font-size:13px">✦ &nbsp; 이렇게 질문해 보세요</strong><p id="promptText"></p><button id="apply">이 질문으로 시작하기 &nbsp; ↗</button></section><details class="hint"><summary>막혔을 때 참고하세요</summary><p id="hint"></p></details><div class="bottom"><button id="prev">← 이전</button><span class="small" id="position"></span><button class="primary" id="next">다음 수업 →</button></div></article>
<section class="practice" aria-label="AI 실습 공간"><div class="practicebar"><strong><span class="dot"></span>나의 AI 실습실</strong><div style="display:flex;gap:12px;align-items:center"><span class="small">예시 체험 모드</span><button id="clear" title="현재 수업의 대화 지우기">새 대화 ↺</button></div></div><div class="chat" id="chat" role="log" aria-live="polite"></div><form id="form" class="compose"><label for="input" class="small">AI에게 요청할 내용을 적어보세요</label><textarea id="input" placeholder="무엇을 만들어 볼까요?" maxlength="4000"></textarea><div class="composefoot"><span class="small">Enter 전송 · Shift + Enter 줄바꿈</span><button class="send" type="submit">보내기 ↑</button></div></form><div class="disclaimer">화면 시안입니다. 실제 AI 대신 수업별로 준비된 예시를 보여줍니다.</div></section></main>
<dialog id="courses"><div class="dialoghead"><h2>나의 배움 지도</h2><button id="closeCourses" aria-label="목차 닫기">✕</button></div><p class="small">기초부터 고급까지, 필요한 수업부터 시작해도 좋아요.</p><input id="search" type="search" placeholder="수업 검색 · 예: 한글, 이미지, 배포" aria-label="수업 검색"><div id="courseList"></div></dialog><div class="toast" role="status" id="toast"></div>
<script>
const groups=['기초 — AI 콘텐츠 만들기','중급 — 플랫폼 활용·문서 작성','고급 — 웹앱 제작·배포'];
// 각 수업: 제목, 소개, 결과물, 실습 3단계, 예시 질문, 도움말, 준비된 예시 답변.
const data=[
['AI 기본 사용법·질문하는 방법','AI에게 하고 싶은 일을 구체적으로 알려주세요. 대상과 상황, 원하는 모양을 더하면 답변이 달라집니다.','첫 번째 AI 질문',['만들고 싶은 결과물을 정해요','대상·목적·형식을 넣어 질문해요','답변을 읽고 한 번 더 요청해요'],'강릉에 사는 50대 주민에게 AI 수업을 소개하고 싶어. 처음 배우는 사람도 편하게 느끼도록 소개글을 3문장으로 써줘. 어려운 용어는 빼줘.','역할 + 대상 + 할 일 + 조건을 적어보세요. 마음에 들지 않는 부분은 “더 짧게”, “친근하게”처럼 다시 요청할 수 있어요.','AI가 처음이어도 괜찮아요. 글을 쓰고 사진으로 이야기를 만드는 일을 함께 배워요. 강릉 이웃들과 천천히, 내 속도로 시작해 보세요.'],
['AI 윤리·개인정보·정보 검증','좋은 결과물은 안전한 자료에서 시작합니다. 개인정보를 가리고, 사실과 사용 권한을 확인해요.','정보 확인 체크리스트',['이름·연락처 등 개인정보를 찾아요','확인해야 할 사실을 구분해요','공식 출처와 이용 권한을 확인해요'],'AI로 강릉 행사 안내문을 만들 때 개인정보, 사실 확인, 이미지 저작권에서 확인할 사항을 각각 2개씩 정리해줘.','실제 주민 명단은 입력하지 마세요. 날짜·가격·주소는 공식 안내와 대조하고, 출처가 없으면 확인이 필요하다고 표시해요.','개인정보: 연락처 삭제, 얼굴 사진 사용 동의 확인\n사실 확인: 주최 기관 공지 확인, 행사 날짜 재확인\n저작권: 이미지 이용 조건 확인, 필요한 출처 표기'],
['텍스트: 소개글·홍보 문구·이야기','우리 동네의 이야기를 짧고 매력적인 글로 바꿔봅니다. 같은 주제로 서로 다른 말투를 비교해요.','강릉 소개글',['소개할 장소나 가게를 정해요','소개글과 홍보 문구를 만들어요','과장된 표현을 고쳐 완성해요'],'강릉 바다 산책을 소개하는 글을 100자 안팎으로 써줘. 이어서 따뜻한 느낌의 홍보 문구 3개를 제안해줘.','운영시간이나 가격처럼 바뀌는 정보는 직접 확인한 자료를 넣어주세요.','파도 소리에 발걸음을 맞추고, 바닷바람에 잠깐 마음을 쉬어 보세요. 강릉의 바다는 서두르지 않는 하루와 잘 어울립니다.\n\n① 오늘은 바다 쪽으로\n② 천천히 걸어도 좋은 강릉\n③ 당신의 하루에 파도 한 줄'],
['이미지: 캐릭터·포스터·카드뉴스·만화','무엇을 보여줄지 먼저 정하고, 색감과 구도를 더해 이미지 제작 요청을 완성합니다.','이미지 제작 기획',['캐릭터·포스터 등 형식을 골라요','주제·색감·구도를 설명해요','글자와 인물 표현을 검토해요'],'강릉 바다를 소개하는 카드뉴스 표지 이미지를 기획해줘. 푸른색과 크림색, 단순한 일러스트, 제목을 넣을 넓은 여백이 필요해.','시안에서는 이미지 제작용 설명을 연습해요. 실제 이미지는 이미지 생성 기능을 연결한 뒤 만들 수 있어요.','정사각형 카드뉴스 표지 기획\n상단: “바다 곁의 하루, 강릉” 제목 공간\n중앙: 완만한 파도와 해변 산책길 일러스트\n색상: 짙은 바다색, 크림색, 옅은 하늘색\n하단: 출처·작성자 표시 공간'],
['음악: 가사·주제곡·홍보송','전하고 싶은 한 문장을 가사로 만들어요. 분위기와 길이를 정해 음악 제작의 바탕을 준비합니다.','홍보송 가사',['노래의 주제와 분위기를 정해요','짧은 가사와 후렴을 만들어요','소리 내어 읽고 리듬을 다듬어요'],'강릉 AI 배움 모임의 밝은 홍보송 가사를 만들어줘. 30초 분량, 쉬운 단어, 함께 시작한다는 내용으로 후렴을 반복해줘.','특정 가수의 목소리를 그대로 복제하기보다 악기·빠르기·분위기를 설명해요.','오늘 처음 만나도 괜찮아\n작은 질문 하나로 시작해\n함께 배워요, 함께 만들어요\n강릉에서 우리 꿈을 그려요\n\n음악 방향: 밝은 어쿠스틱 팝, 손뼉 리듬, 약 30초'],
['영상: 움직이는 사진·숏폼·홍보 영상','짧은 영상도 장면 계획부터 시작합니다. 사진과 자막, 움직임을 연결해 하나의 이야기를 만들어요.','15초 영상 구성안',['영상의 대상과 목적을 정해요','장면별 화면·자막을 적어요','사진 동의와 음악 권한을 확인해요'],'강릉 바다 산책을 소개하는 15초 세로 영상 구성안을 만들어줘. 5초씩 3장면으로 나누고 화면, 자막, 움직임을 적어줘.','실제 사진을 쓸 때는 인물의 동의를 받아요. 시안에서는 영상 파일 대신 구성안을 연습합니다.','0–5초: 파도가 들어오는 해변 / “잠깐, 쉬어가요” / 천천히 확대\n5–10초: 바다 곁 산책길 / “나만의 속도로” / 옆으로 이동\n10–15초: 수평선 / “오늘의 목적지, 강릉” / 부드럽게 어두워짐'],
['종합: 동화책·뮤직비디오·추억 사진첩','글과 이미지, 음악을 하나의 작품으로 엮어요. 작은 분량으로 끝까지 완성하는 것이 목표예요.','나만의 작품 구성안',['동화책·뮤직비디오·사진첩을 골라요','이야기 흐름과 필요한 자료를 정해요','표지부터 끝까지 순서를 점검해요'],'강릉 바다를 처음 만난 작은 고양이의 동화책을 4장으로 기획해줘. 각 장의 짧은 이야기와 이미지 설명을 함께 써줘.','사진첩을 고른다면 사진별 날짜와 이야기를 먼저 정리해 보세요.','1장: 고양이는 멀리서 들리는 파도 소리를 따라가요. / 골목 끝의 작은 고양이\n2장: 눈앞에 넓은 바다가 펼쳐져요. / 바다를 바라보는 뒷모습\n3장: 모래 위에 작은 발자국을 남겨요. / 발자국과 조개\n4장: 내일도 만나자고 바다에 인사해요. / 노을 속 고양이'],
['제미나이 노트북: RAG·자료 기반 대화·콘텐츠 제작','준비한 강릉 자료를 바탕으로 질문합니다. 자료에서 찾은 내용과 확인되지 않은 내용을 구분해요.','자료 기반 질문 설계',['공개된 강릉 관련 자료를 준비해요','근거를 요청하며 질문해요','발표자료·팟캐스트 구성을 만들어요'],'강릉 소개 자료를 넣었다고 가정하고, 자료 기반 챗봇에 물어볼 질문 5개와 출처 확인 방법을 만들어줘.','RAG는 관련 자료를 찾아 답변에 활용하는 방식이에요. 이 시안에는 파일 업로드나 실제 자료 검색이 연결되지 않았어요.','질문 예시\n① 자료에 등장하는 주요 장소는?\n② 가족 방문객에게 적합한 내용은?\n③ 3분 발표의 핵심은?\n④ 2인 대화형 팟캐스트 구성은?\n⑤ 자료에서 확인할 수 없는 정보는?\n각 답변의 인용을 열고 원문 문장과 비교해요.'],
['구글 스티치: 강릉 소개 홈페이지 디자인','방문자가 무엇을 보고 행동할지 먼저 생각합니다. 강릉의 분위기를 담은 홈페이지 화면을 기획해요.','홈페이지 디자인 요청서',['방문자와 화면의 목적을 정해요','첫 화면·소개·장소 순서를 잡아요','모바일에서 읽기 쉽게 다듬어요'],'구글 스티치에 입력할 강릉 소개 홈페이지 디자인 요청서를 써줘. 큰 글씨, 바다색, 장소 카드 3개, 모바일에서도 단순한 화면으로 구성해줘.','첫 화면에 메뉴를 너무 많이 넣지 마세요. 대표 행동 하나를 먼저 보여주세요.','디자인 요청서\n대상: 강릉을 처음 방문하는 성인\n첫 화면: 바다 사진과 “천천히 만나는 강릉”\n구성: 소개 → 장소 카드 3개 → 방문 전 확인\n스타일: 바다색·밝은 배경, 큰 본문, 넓은 버튼\n모바일: 카드를 한 줄씩 배치'],
['Make: 게시판 수집·예약 실행·노션 연동','반복되는 정보 정리 과정을 연결합니다. 강릉 게시판의 새 소식을 정해진 시간에 확인하는 흐름을 설계해요.','자동화 흐름도',['수집할 게시판과 항목을 정해요','예약 실행·중복 확인을 설계해요','노션 저장과 실패 알림을 정해요'],'강릉 지역 게시판의 새 글 제목, 날짜, 링크를 매일 오전 9시에 확인해 노션에 저장하는 Make 흐름을 설계해줘. 중복 방지와 오류 처리도 포함해줘.','게시판의 이용 조건을 확인하고 공식 RSS나 API가 있으면 우선 활용해요.','예약 실행 → RSS/API 새 글 조회 → 원문 링크로 중복 검색 → 새 글만 노션 등록\n노션 필드: 제목·게시일·원문 링크·수집 시각\n실패 시: 오류 기록과 관리자 알림\n실행 전: 테스트 글 1개로 필드 연결 확인'],
['한글: 기존 양식에 맞춘 사업계획서 작성','빈 문서부터 시작하지 않아도 됩니다. 기존 양식의 항목과 분량에 맞춰 사업계획의 내용을 채워요.','사업계획서 초안',['기존 양식의 항목·분량을 확인해요','문제·대상·해결 방법을 작성해요','근거·예산·일정의 일치를 확인해요'],'기존 사업계획서 양식의 항목이 사업 목적, 대상, 추진 내용, 기대효과야. 강릉 30~60대 주민의 AI 교육·실습 웹앱 사업을 항목당 3문장으로 작성해줘. 확인되지 않은 성과나 수치는 넣지 마.','표·쪽 구성은 원본 양식을 유지해요. 이 화면은 문구 초안 실습이며 실제 HWP 파일을 편집하지 않아요.','사업 목적: AI에 관심이 있는 강릉 주민이 쉽게 배우고 실습하도록 돕습니다. 수업 안내와 실습을 한 화면에서 제공합니다. 생활과 업무에 활용할 결과물 제작을 지원합니다.\n\n대상: 강릉 거주 30~60대 주민입니다. AI 입문자와 무료 도구 활용에 관심이 있는 사람을 중심으로 합니다. 디지털 숙련도를 고려해 단계별 안내를 제공합니다.\n\n추진 내용: 기존 수업 경험을 기초·중급·고급 과정으로 정리합니다. 전자책형 안내와 실습 화면을 구성합니다. 사용자 테스트 의견을 반영해 UI를 개선합니다.\n\n기대효과: 첫 AI 실습의 부담을 낮출 수 있습니다. 일상과 업무용 콘텐츠 제작을 도울 수 있습니다. 지역 주민의 학습 경험을 축적할 수 있습니다.'],
['PPT: 사업계획 발표자료 제작','사업계획의 핵심을 짧은 발표로 전달합니다. 한 장에 하나의 메시지만 담아보세요.','발표자료 목차',['발표 시간과 청중을 정해요','문제부터 실행 계획까지 구성해요','장마다 핵심 문장을 정해요'],'강릉 주민 AI 교육 웹앱 사업계획을 5분 발표하려고 해. 6장 PPT 목차와 각 장의 핵심 문장, 추천 시각자료를 작성해줘.','긴 문단보다 핵심 문장과 도표를 사용해요. 확인되지 않은 지표는 목표 또는 가정으로 표시해요.','1. 문제: 배우고 싶지만 시작이 어려워요 / 사용자 상황\n2. 대상: 강릉 30~60대 주민 / 대상 요약\n3. 해결: 설명과 실습을 한 화면에 / 화면 시안\n4. 교육: 기초·중급·고급 / 과정 지도\n5. 실행: 제작·테스트·개선 / 일정표\n6. 기대: 일상 속 AI 활용 / 활용 사례'],
['엑셀: 견적서·일정표 제작','자주 사용하는 표를 정확하게 만듭니다. 입력값과 계산값을 구분하고 합계를 직접 검산해요.','견적서·일정표 설계',['필요한 열과 입력 항목을 정해요','금액 계산식과 일정을 작성해요','합계와 날짜를 검산해요'],'AI 교육 견적서의 열을 품목, 수량, 단가, 금액으로 구성해줘. 2행부터 5행까지 금액 수식과 6행 합계 수식을 알려줘. 예시 값은 가상이라고 표시해줘.','실제 세금 적용 여부와 금액은 담당자와 확인해요. 기존 파일의 수식 셀은 덮어쓰지 않아요.','A열 품목 / B열 수량 / C열 단가 / D열 금액\nD2: =B2*C2 → D5까지 채우기\nD6: =SUM(D2:D5)\n가상 예시: 교재 10부 × 5,000원 = 50,000원\n일정표 열: 작업·담당·시작일·종료일·진행 상태'],
['노션·구글 드라이브: 자료 정리·공유','다시 찾기 쉬운 자료실을 만듭니다. 원본 자료와 수업 안내를 연결하고 공유 범위를 확인해요.','수업 자료실 구조',['과정별 폴더와 이름 규칙을 정해요','노션에서 자료 링크를 연결해요','보기·편집 권한을 확인해요'],'AI 수업 자료를 노션과 구글 드라이브에 정리할 구조를 제안해줘. 기초·중급·고급 분류와 파일 이름 규칙, 공유 권한 확인 방법을 포함해줘.','공유 링크를 만든 뒤 다른 계정이나 로그아웃 창에서 접근 범위를 확인해요.','드라이브: 01_기초 / 02_중급 / 03_고급 / 04_결과물\n파일 이름: 날짜_수업번호_제목_버전\n노션: 수업명·단계·설명·원본 링크·결과물\n권한: 수강생은 보기, 담당 강사는 필요한 폴더만 편집'],
['제품 브랜딩·로고·제품 이미지 제작','제품이 전하고 싶은 가치를 정하고 이름과 시각 요소를 일관되게 만듭니다.','브랜드 기획안',['제품과 주요 고객을 정해요','이름·색상·말투를 정해요','로고와 제품 이미지 방향을 잡아요'],'강릉 바다에서 영감을 받은 가상의 수제 비누 브랜드를 기획해줘. 이름 후보 3개, 브랜드 문장, 색상, 로고 이미지 제작 설명을 제안해줘.','실제 사용 전에 상표 중복을 확인해요. 검증되지 않은 효능은 홍보 문구에 넣지 않아요.','가상 이름: 물결담 / 바다한조각 / 해온\n브랜드 문장: 일상에 잠깐의 바다를\n색상: 바다 청록·모래 베이지\n로고 방향: 하나의 물결 선과 단정한 글자\n제품 사진: 밝은 배경, 자연광, 과장 없는 질감'],
['이미지 호스팅·단일 HTML 상품페이지 제작','제품 사진과 설명을 하나의 웹페이지로 묶어요. 이미지 주소와 모바일 화면을 점검합니다.','상품페이지 구성안',['사용 가능한 이미지 주소를 준비해요','제품 소개·특징·문의 순서를 정해요','모바일과 이미지 대체 문구를 확인해요'],'가상의 강릉 수제 비누 상품페이지를 단일 HTML로 만들기 위한 명세를 써줘. 대표 이미지, 제품 설명, 특징 3개, 문의 영역과 모바일 대응을 포함해줘.','이미지 주소는 공개 접근 가능 여부를 확인해요. 키나 개인정보가 담긴 링크는 넣지 않아요.','페이지 구성: 대표 이미지 → 브랜드 문장 → 제품 특징 3개 → 상세 안내 → 문의\n기술 조건: HTML 하나에 CSS 포함, 모바일 1열\n이미지: HTTPS 주소와 대체 텍스트\n검토: 가격·배송·성분은 실제 확인된 정보로 교체'],
['생활 웹앱·게임 제작','작은 불편 하나를 해결하는 기능부터 만듭니다. 입력, 처리, 결과를 순서대로 생각해요.','웹앱 기능 명세',['생활 속 불편 하나를 골라요','핵심 기능 하나를 정해요','정상·빈 입력·잘못된 입력을 시험해요'],'단일 HTML로 만드는 준비물 체크리스트 앱의 명세를 작성해줘. 항목 추가, 완료 표시, 삭제, 브라우저 저장이 필요해. 큰 버튼과 쉬운 한국어를 써줘.','처음부터 기능을 많이 넣기보다 하나의 흐름을 끝까지 작동시켜요.','입력: 준비물 이름\n처리: 추가·완료·삭제\n저장: 브라우저 localStorage\n화면: 입력창, 추가 버튼, 목록, 남은 개수\n검증: 빈 항목 방지, 새로고침 후 복원, 긴 글 줄바꿈'],
['AI API 연결·사용량 관리','웹앱에서 AI를 부르는 구조를 이해합니다. 비용 한도와 오류 안내까지 함께 설계해요.','AI 연결 구조도',['화면과 서버 역할을 구분해요','키 보관·요청 제한을 정해요','오류와 사용량 표시를 설계해요'],'AI 실습 웹앱의 API 연결 구조를 설명해줘. 브라우저에 키를 넣지 않고 서버에서 호출하며, 사용자별 제한과 비용 한도를 적용하는 흐름으로 작성해줘.','API 키는 HTML이나 공개 GitHub에 넣지 않아요. 이 시안은 API 호출과 비용 발생이 없어요.','브라우저 질문 → 서버 인증·길이·횟수 확인 → AI API 호출 → 결과 반환\n키: 서버의 비밀 환경변수\n관리: 요청별 사용량 기록·일일 한도·전체 예산\n실패: 한도 초과·네트워크 오류를 쉬운 말로 안내'],
['공공데이터 활용·지역 문제 해결 서비스','지역의 문제와 필요한 데이터를 연결합니다. 데이터 갱신일과 출처가 보이는 서비스를 기획해요.','지역 서비스 기획서',['주민의 불편을 구체적으로 적어요','공식 데이터와 이용 조건을 찾아요','검색·표시·오류 상황을 설계해요'],'강릉의 교육·행사 정보를 한곳에서 찾는 서비스를 기획해줘. 필요한 데이터 항목, 검색 조건, 출처와 갱신일 표시, 정보가 없을 때 안내를 정리해줘.','실제 데이터 제공 여부와 호출 제한은 해당 기관에서 확인해야 해요.','필요 항목: 제목·장소·대상·기간·신청 링크·출처\n검색: 날짜·대상·분야\n표시: 원문 링크와 마지막 확인일\n빈 결과: “조건을 넓혀 다시 찾아보세요.”\n주의: 종료 여부는 주최 기관 원문에서 최종 확인'],
['GitHub 등록·Cloudflare 배포','내 컴퓨터에서 만든 웹앱을 공유할 준비를 합니다. 소스 보관과 배포 후 확인을 나누어 점검해요.','배포 체크리스트',['개인정보와 키를 제거해요','GitHub에 소스와 설명을 등록해요','Cloudflare 배포 후 실제 주소를 확인해요'],'단일 HTML 웹앱을 공개 GitHub에 등록하고 Cloudflare에 배포할 때의 체크리스트를 만들어줘. 비밀키 검사, 라이선스, 모바일 확인, 이전 버전 복구를 포함해줘.','이 화면의 예시는 실제 저장소 등록이나 배포를 수행하지 않아요.','등록 전: 비밀키·개인정보·사용 권한 확인\nGitHub: index.html과 README, 변경 기록\nCloudflare: 프로젝트 연결·배포 설정 확인\n배포 후: 실제 주소, 모바일, 링크, 오류 점검\n복구: 직전 정상 버전과 되돌리는 방법 기록'],
['사용자 테스트·UI 개선','사용자가 설명 없이 할 수 있는지 관찰합니다. 막히는 지점을 줄이고 다시 확인해요.','사용자 테스트 기록지',['수업 선택·질문 전송 등 과제를 정해요','도움 없이 해보는 모습을 관찰해요','불편을 고치고 다시 확인해요'],'강릉 30~60대 주민이 사용할 AI 실습 웹앱의 사용자 테스트 기록지를 만들어줘. 수업 찾기, 예시 질문 사용, 결과 확인 3개 과제와 관찰 항목을 포함해줘.','사용자의 실수가 아니라 화면에서 개선할 점을 찾아요. 개인정보 수집은 필요한 범위로 최소화해요.','과제 1: 한글 사업계획서 수업 찾기\n과제 2: 예시 질문을 수정해 전송하기\n과제 3: 결과를 읽고 다음 수업으로 이동하기\n기록: 성공 여부·막힌 위치·도움 요청·사용자 의견\n개선 우선순위: 진행 불가 → 혼동 → 시각적 불편'],
['선택 심화: 3D·피지컬 AI·Unity·파이썬','관심 있는 분야 하나를 골라 작은 프로젝트를 설계합니다. 준비물과 실행 환경부터 확인해요.','심화 프로젝트 계획',['관심 분야 하나를 선택해요','환경·준비물·안전 조건을 확인해요','최소 결과물과 테스트를 정해요'],'3D, 피지컬 AI, Unity, 파이썬 중 입문자가 선택할 작은 프로젝트를 분야별로 하나씩 제안해줘. 준비물과 첫 목표를 함께 적어줘.','하드웨어를 다룰 때는 전원과 연결 안전을 확인해요. 파이썬은 프로젝트별 가상환경을 사용해요.','3D: 단순한 강릉 기념품 모형 / 3D 편집 도구 / 기본 형태 완성\n피지컬 AI: 밝기에 반응하는 LED / 센서·보드 / 센서값 읽기\nUnity: 바닷가 산책 미니게임 / Unity / 이동과 충돌\n파이썬: 공개 CSV 일정 정리 / 가상환경 / 읽기와 필터링']
];
const lessons=data.map((d,i)=>({title:d[0],intro:d[1],output:d[2],steps:d[3],prompt:d[4],hint:d[5],answer:d[6],group:i<7?0:i<14?1:2,code:i<7?'1.'+(i+1):i<14?'2.'+(i-6):'3.'+(i-13)}));
const $=id=>document.getElementById(id);let current=0,checks={},conversations={},drafts={};try{const saved=JSON.parse(localStorage.getItem('mylab-prototype-v1')||'{}');checks=saved.checks&&typeof saved.checks==='object'?saved.checks:{};current=Number.isInteger(saved.current)&&saved.current>=0&&saved.current<22?saved.current:0}catch{}
const escapeHTML=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('mylab-prototype-v1',JSON.stringify({current,checks}))}catch{notify('이 브라우저에서는 학습 기록을 저장할 수 없어요.')}}
function completed(i){return Array.isArray(checks[i])&&[0,1,2].every(n=>checks[i].includes(n))}
function progress(){const count=lessons.filter((_,i)=>completed(i)).length;$('progressText').textContent=`나의 배움 ${count} / 22`;$('progressFill').style.width=(count/22*100)+'%';$('stepCount').textContent=(Array.isArray(checks[current])?checks[current].length:0)+' / 3'}
function notify(t){$('toast').textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').textContent='',2600)}
function render(){const l=lessons[current];$('eyebrow').textContent=`${groups[l.group].split(' — ')[0]} · LESSON ${l.code}`;$('title').textContent=l.title;$('intro').textContent=l.intro;$('output').textContent=l.output;$('promptText').textContent=l.prompt;$('hint').textContent=l.hint;$('position').textContent=`${current+1} / 22`;$('prev').disabled=current===0;$('next').textContent=current===21?'학습 마무리 ✓':'다음 수업 →';$('input').value=drafts[current]||'';document.querySelectorAll('.level').forEach((b,i)=>{b.classList.toggle('active',i===l.group);b.setAttribute('aria-current',i===l.group?'step':'false')});$('steps').innerHTML=l.steps.map((s,i)=>`<label class="checkrow"><input type="checkbox" data-step="${i}" ${Array.isArray(checks[current])&&checks[current].includes(i)?'checked':''}><span>${s}</span></label>`).join('');progress();renderChat();save()}
const art=`<svg class="art" viewBox="0 0 160 130" fill="none" aria-hidden="true"><ellipse cx="80" cy="111" rx="59" ry="10" fill="#edf1e9"/><path d="M34 86V30l46 13 46-13v56l-46 16z" fill="#f2f5ed" stroke="#8aa68b" stroke-width="1.5"/><path d="M80 43v59M43 44l26 7M43 54l26 7M43 64l19 5M91 52l25-7M91 62l25-7" stroke="#9bb09b" stroke-width="2" stroke-linecap="round"/><path d="M109 9v20M99 19h20" stroke="#487453" stroke-width="2.5" stroke-linecap="round"/><circle cx="36" cy="17" r="4" fill="#dfbe71"/><path d="m127 91 4 8 9 1-7 6 2 9-8-4-8 4 1-9-6-6 9-1z" fill="#e8cc86"/></svg>`;
function renderChat(){const list=conversations[current]||[];$('chat').innerHTML=list.length?list.map(m=>`<div class="message ${m.role}">${m.role==='assistant'?'<b>마이랩 도우미 · 준비된 예시</b>':''}${escapeHTML(m.text)}</div>`).join(''):`<div class="welcome">${art}<div class="eyebrow" style="font-size:10px;letter-spacing:2px;margin-bottom:12px">LEARN. TRY. MAKE.</div><h2>작은 질문이, 나의 작품으로.</h2><p>왼쪽의 설명을 읽고 바로 시도해 보세요.<br>잘 쓰는 것보다, 한 번 시작하는 게 중요해요.</p><button class="suggestion" id="suggest"><span>↗</span><div>${escapeHTML(lessons[current].output)}부터 시작하기<small>수업에 맞는 예시 질문을 입력해 드려요.</small></div></button></div>`;if($('suggest'))$('suggest').onclick=apply;$('chat').scrollTop=$('chat').scrollHeight}
function apply(){$('input').value=lessons[current].prompt;drafts[current]=$('input').value;$('input').focus();if(innerWidth<741)$('form').scrollIntoView({behavior:'smooth',block:'center'})}
function go(i){drafts[current]=$('input').value;current=i;document.querySelector('.hint').open=false;render();if(innerWidth<741)window.scrollTo({top:0,behavior:'smooth'})}
function renderCourses(){const q=$('search').value.trim().toLowerCase();$('courseList').innerHTML=groups.map((g,n)=>{const items=lessons.map((l,i)=>({...l,i})).filter(l=>l.group===n&&(l.title+l.code).toLowerCase().includes(q));return items.length?`<section class="coursegroup"><h3>${g}</h3>${items.map(l=>`<button class="courseitem" data-lesson="${l.i}" aria-current="${l.i===current}"><em>${l.code}</em>${escapeHTML(l.title)} ${completed(l.i)?'✓':''}</button>`).join('')}</section>`:''}).join('')||'<p class="small">검색 결과가 없어요. 다른 단어로 찾아보세요.</p>'}
$('openCourses').onclick=()=>{$('search').value='';renderCourses();$('courses').showModal()};$('closeCourses').onclick=()=>$('courses').close();$('search').oninput=renderCourses;$('courseList').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b){go(Number(b.dataset.lesson));$('courses').close()}};document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>go([0,7,14][Number(b.dataset.level)]));$('apply').onclick=apply;$('prev').onclick=()=>{if(current>0)go(current-1)};$('next').onclick=()=>{if(current<21)go(current+1);else notify(`22개 수업을 둘러봤어요. 체크리스트를 완료한 수업은 ${lessons.filter((_,i)=>completed(i)).length}개예요.`)};$('steps').onchange=e=>{const n=Number(e.target.dataset.step);let set=new Set(Array.isArray(checks[current])?checks[current]:[]);e.target.checked?set.add(n):set.delete(n);checks[current]=[...set];save();progress()};$('input').oninput=()=>{drafts[current]=$('input').value};$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit()}};$('form').onsubmit=e=>{e.preventDefault();const text=$('input').value.trim();if(!text){$('input').focus();return}const list=conversations[current]||(conversations[current]=[]);list.push({role:'user',text},{role:'assistant',text:'아래는 이 수업의 고정 예시입니다. 입력한 질문을 실제 AI가 분석한 결과는 아니에요.\n\n'+lessons[current].answer+'\n\n직접 해보기: 이 예시에서 나의 상황에 맞게 바꿀 부분을 찾아보세요.'});$('input').value='';drafts[current]='';renderChat()};$('clear').onclick=()=>{conversations[current]=[];drafts[current]='';$('input').value='';renderChat();notify('현재 수업의 대화를 새로 시작해요.')};render();
</script></body></html>
